<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8553a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="맛집일기">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>맛집 지도 일기</title>
<script src="config.js?v=7"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<style>
/* 레이아웃: 처음엔 가족사진 홈 화면 → 맛집·카페 / 여행. 전체 화면 지도 + 하단 탭 + 위로 올라오는 기록 화면 */
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --fg:#2b2622; --muted:#7d746b; --line:#e5ddd2;
  --accent:#b8553a; --accent-soft:#f3dcd3; --star:#e8a317; --star-off:#ddd3c4;
  --trip:#2f6f73;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1916; --panel:#26221e; --fg:#f0e9e0; --muted:#a39a8f; --line:#3a342d;
  --accent:#e08565; --accent-soft:#4a2f26; --star:#f0b83a; --star-off:#4a4237; --trip:#6cbcc0;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#map{position:fixed;inset:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:0}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:500;display:flex;justify-content:center;
  background:var(--panel);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px;height:var(--tabh)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:12px;cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add{color:var(--accent)}
.tab.add .plus{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-14px;
  box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tab.add .plus svg{stroke:#fff;width:24px;height:24px}
body.trip .tab.on,body.trip .tab.add{color:var(--trip)}
body.trip .tab.add .plus{background:var(--trip)}

/* 안내 띠 */
.banner{position:fixed;z-index:600;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;
  font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.banner[hidden]{display:none}
.banner button{border:0;border-radius:999px;background:var(--bg);color:var(--fg);padding:4px 12px;cursor:pointer}

/* 겹쳐서 뜨는 화면 */
.screen{position:fixed;inset:0;z-index:400;display:flex;justify-content:center}
.screen[hidden]{display:none}
.screen .page{width:100%;max-width:520px;background:var(--panel);display:flex;flex-direction:column;min-height:0;
  box-shadow:0 0 30px rgba(0,0,0,.18)}
#listScreen{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
.editor{z-index:700}
.bar{display:flex;align-items:center;gap:8px;min-height:54px;flex:none;border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.bar h1{flex:1;min-width:0;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:0;background:none;color:var(--accent);font-size:15px;cursor:pointer;padding:8px 6px;white-space:nowrap}
body.trip .ibtn{color:var(--trip)}
.ibtn.danger,body.trip .ibtn.danger{color:#c0392b}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* 홈 화면 */
.home{z-index:800;background:#3a2c24;color:#fff;overflow:hidden}
.home .bg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);max-width:100%;max-height:100%;width:auto;height:auto;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 14%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);mask-composite:intersect}
.home .bg[hidden]{display:none}
.home .empty-photo{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 32px;color:#f3dcd3;
  background:radial-gradient(circle at 30% 20%,#7a4a38,#3a2c24 70%)}
.home .empty-photo[hidden]{display:none}
.home .empty-photo button{margin-top:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;
  border-radius:999px;padding:9px 18px;cursor:pointer}
.home .inner{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.home .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.home h1{margin:0;font-size:26px;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.home .date{font-size:13px;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.home .cam{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(6px)}
.home .cam svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home .menu{display:grid;gap:12px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid rgba(255,255,255,.28);border-radius:16px;
  background:rgba(30,22,18,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:10px 14px;cursor:pointer}
.mbtn .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent)}
.mbtn.trip .ic{background:var(--trip)}
.mbtn .ic svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mbtn .t{font-size:17px;font-weight:600}
.mbtn .s{font-size:13px;opacity:.85}
.mbtn:hover{background:rgba(30,22,18,.55)}
.home.light{color:#3b2a20}
.home.light h1,.home.light .date,.home.light .outlink{color:#3b2a20;text-shadow:none}
.home.light .mbtn{background:rgba(255,255,255,.58);border-color:rgba(60,40,30,.14);color:#3b2a20;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.home.light .mbtn:hover{background:rgba(255,255,255,.75)}
.home.light .cam{background:rgba(255,255,255,.62)}
.home.light .cam svg{stroke:#3b2a20}
.home .outlink{margin-top:6px;border:0;background:none;color:#fff;opacity:.8;font-size:12px;text-decoration:underline;cursor:pointer;padding:2px 0;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.home .outlink[hidden]{display:none}

/* 로그인 */
.login{z-index:900;background:var(--bg)}
.login .page{max-width:420px;justify-content:center;box-shadow:none;background:var(--bg)}
.login form{display:grid;gap:12px;margin-top:18px}
.login h1{margin:0;font-size:26px}
.login .sub{color:var(--muted);margin-top:4px}
.login .err{color:#c0392b;font-size:14px;min-height:20px}
.login .btn{padding:11px 14px;font-size:16px}

/* 목록 */
.stat{display:flex;gap:16px;margin-bottom:14px;color:var(--muted);font-size:13px}
.stat b{color:var(--fg);font-size:18px;font-variant-numeric:tabular-nums;display:block}
.card{display:flex;gap:12px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:10px;margin-bottom:10px;cursor:pointer}
.card .th{width:64px;height:64px;border-radius:8px;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-size:26px;overflow:hidden}
body.trip .card .th{background:color-mix(in srgb,var(--trip) 18%,var(--bg))}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .tx{min-width:0;flex:1}
.card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:13px;color:var(--muted)}
.card .st{font-size:13px;color:var(--star);letter-spacing:1px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.day{font-size:13px;font-weight:600;color:var(--trip);margin:18px 0 8px;display:flex;justify-content:space-between}
.day span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:0 8px;margin-right:6px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
body.trip .tag{background:color-mix(in srgb,var(--trip) 18%,var(--bg));color:var(--trip)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}

/* 폼 */
label.lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 0 4px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],textarea{
  width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--bg);border:0;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
body.trip .seg button.on{background:var(--trip)}
section.sec{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:12px;margin-top:16px}
section.sec h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:2px 3px;font-size:30px;line-height:1;cursor:pointer;color:var(--star-off)}
.stars button.on{color:var(--star)}
.score{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;
  background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.addph{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;
  color:var(--muted);font-size:13px;cursor:pointer;text-align:center;padding:4px}
.acid{display:grid;gap:6px}
.acid input[type=range]{width:100%;accent-color:var(--accent)}
.acid .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.acid .now b{color:var(--accent)}
.price{display:flex;align-items:center;gap:6px}
.price input{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.total b{font-size:20px;font-variant-numeric:tabular-nums}
.saved{font-size:12px;color:var(--muted);text-align:right;min-height:18px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
body.trip .btn.on{background:var(--trip);border-color:var(--trip)}

.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);
  border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.pin.trip{background:var(--trip)}
.pin span{transform:rotate(45deg);font-size:15px;line-height:1}
.leaflet-container{font-family:var(--font)}

/* 가게 검색 */
.search{position:fixed;z-index:390;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;
  padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.search[hidden]{display:none}
.search>*{pointer-events:auto;width:100%;max-width:496px}
.search input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:11px 18px;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.results{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  max-height:50vh;overflow-y:auto}
.results[hidden]{display:none}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results .rn{font-weight:600}
.results .rs{font-size:12px;color:var(--muted)}
.results .tag{margin-left:6px}
.results .none{padding:12px 16px;color:var(--muted);font-size:14px}
.results .manual{color:var(--accent);font-size:14px}
body.trip .results .manual{color:var(--trip)}

/* 카카오맵 핀 */
.kpin{position:relative;width:34px;height:34px;transform:translateY(-7px);cursor:pointer}
.kpin .plabel{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;white-space:nowrap;
  background:var(--panel);color:var(--fg);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.kpin .plabel:empty{display:none}
</style>
</head>
<body>
<div id="map" aria-label="지도"></div>

<div class="search" id="search">
  <input type="search" id="q" placeholder="가게 이름 검색 (예: 스타벅스 동백)" autocomplete="off" aria-label="장소 검색">
  <div class="results" id="results" hidden></div>
</div>

<div class="banner" id="banner" hidden><span id="bannerText"></span><button type="button" id="bannerCancel">취소</button></div>

<!-- 목록 (맛집 목록 / 여행 목록 / 여행 일정) -->
<div class="screen" id="listScreen" hidden>
  <div class="page">
    <div class="bar">
      <button class="ibtn" id="listBack" type="button" hidden>← 여행 목록</button>
      <h1 id="listTitle"></h1>
      <button class="ibtn" id="listAct" type="button" hidden></button>
    </div>
    <div class="scroll" id="listBody"></div>
  </div>
</div>

<!-- 맛집·카페 기록 -->
<div class="screen editor" id="editScreen" hidden>
  <div class="page">
    <div class="bar">
      <button class="ibtn" id="backBtn" type="button">← 닫기</button>
      <h1 id="pname"></h1>
      <button class="ibtn danger" id="delBtn" type="button">삭제</button>
    </div>
    <div class="scroll" id="editBody">
      <div class="row" style="margin-bottom:12px">
        <div style="flex:2"><label class="lbl" for="name">가게 이름</label><input type="text" id="name"></div>
        <div><label class="lbl" for="date">방문일</label><input type="date" id="date"></div>
      </div>
      <div class="seg" id="kindSeg" style="margin-bottom:12px">
        <button type="button" data-k="cafe">카페</button><button type="button" data-k="bakery">빵집</button>
      </div>
      <div style="margin-bottom:16px">
        <label class="lbl" for="withWho">같이 간 사람</label>
        <input type="text" id="withWho" list="withList" placeholder="예: 혼자, 친구 민수, 가족">
        <datalist id="withList"></datalist>
      </div>

      <label class="lbl">사진</label>
      <div class="photos" id="photos"></div>
      <input type="file" id="file" accept="image/*" multiple hidden>

      <section class="sec">
        <h2><span>커피</span><span class="score" id="coffeeScore"></span></h2>
        <div><label class="lbl">맛 별점</label><div class="stars" id="coffeeStars"></div></div>
        <div class="acid">
          <label class="lbl" for="acidity">산도</label>
          <input type="range" id="acidity" min="1" max="5" step="1">
          <div class="ends"><span>고소·쌉쌀</span><span>상큼·과일</span></div>
          <div class="now" id="acidNow"></div>
        </div>
        <div><label class="lbl" for="coffeeMenu">마신 메뉴</label><input type="text" id="coffeeMenu" placeholder="예: 핸드드립 에티오피아"></div>
        <div><label class="lbl" for="coffeePrice">커피 금액</label>
          <div class="price"><input type="number" id="coffeePrice" inputmode="numeric" min="0" step="100" placeholder="0"><span>원</span></div></div>
        <div><label class="lbl" for="coffeeNote">커피 메모</label><textarea id="coffeeNote" placeholder="향, 바디감, 끝맛 등"></textarea></div>
      </section>

      <section class="sec">
        <h2><span>빵 · 디저트</span><span class="score" id="bakeScore"></span></h2>
        <div><label class="lbl">맛 별점</label><div class="stars" id="bakeStars"></div></div>
        <div><label class="lbl" for="bakeMenu">먹은 메뉴</label><input type="text" id="bakeMenu" placeholder="예: 소금빵, 바스크 치즈케이크"></div>
        <div><label class="lbl" for="bakePrice">빵 · 디저트 금액</label>
          <div class="price"><input type="number" id="bakePrice" inputmode="numeric" min="0" step="100" placeholder="0"><span>원</span></div></div>
        <div><label class="lbl" for="bakeNote">빵 · 디저트 메모</label><textarea id="bakeNote" placeholder="식감, 단맛, 재방문 의사 등"></textarea></div>
      </section>

      <section class="sec">
        <div class="total"><span>이번 방문 지출</span><b id="totalPrice">0원</b></div>
        <label class="lbl" for="memo">전체 메모</label>
        <textarea id="memo" placeholder="분위기, 주차, 한줄평"></textarea>
        <div><button class="btn" id="moveBtn" type="button">핀 위치 옮기기</button></div>
        <div class="saved"></div>
      </section>
    </div>
  </div>
</div>

<!-- 여행 정보 -->
<div class="screen editor" id="tripScreen" hidden>
  <div class="page">
    <div class="bar">
      <button class="ibtn" id="tBack" type="button">← 닫기</button>
      <h1 id="tHead">여행 정보</h1>
      <button class="ibtn danger" id="tDel" type="button">삭제</button>
    </div>
    <div class="scroll">
      <div style="margin-bottom:12px"><label class="lbl" for="tTitle">여행 이름</label><input type="text" id="tTitle" placeholder="예: 제주도 가족여행"></div>
      <div class="row" style="margin-bottom:12px">
        <div><label class="lbl" for="tStart">출발일</label><input type="date" id="tStart"></div>

<script>
const APP_VER='7';
const $=id=>document.getElementById(id);
const ACID=[['매우 낮음','쌉쌀하고 묵직한 맛'],['낮음','고소하고 부드러운 맛'],['중간','균형 잡힌 산미'],['높음','과일처럼 상큼한 산미'],['매우 높음','레몬처럼 날카로운 산미']];
const KIND={spot:{label:'명소',icon:'📍'},food:{label:'식당',icon:'🍽️'},cafe:{label:'카페',icon:'☕'},bakery:{label:'빵집',icon:'🥐'},lodging:{label:'숙소',icon:'🛏️'}};
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const DOW=['일','월','화','수','목','금','토'];
function mdw(s){if(!s)return '';const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+' ('+DOW[d.getDay()]+')'}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function norm(p){
  p.kind=p.kind||'cafe'; p.with=p.with||''; p.memo=p.memo||''; p.photos=p.photos||[];
  p.coffee=Object.assign({rating:0,acidity:3,menu:'',note:'',price:''},p.coffee);
  p.bake=Object.assign({rating:0,menu:'',note:'',price:''},p.bake);
  return p;
}
function normStop(s){
  return Object.assign({id:'s'+Date.now(),kind:'spot',name:'',lat:0,lng:0,date:'',time:'',rating:0,cost:'',nights:'',note:'',photos:[]},s);
}
function normTrip(t){
  t=Object.assign({id:'t'+Date.now(),title:'',start:'',end:'',with:'',note:'',stops:[]},t);
  t.stops=t.stops.map(normStop);return t;
}
function newPlace(lat,lng){return norm({id:'p'+Date.now(),name:'',lat,lng,date:today()})}

/* 저장소: 사진이 많아도 되도록 IndexedDB 사용 */
const idb={
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('cafe-diary',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(k){const d=await this.open();return new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  async set(k,v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
};
let db={places:[],trips:[],home:{photo:''}}, cur=null, curTrip=null, curStop=null, activeTrip=null, section=null, saveTimer;
function setSaved(t){document.querySelectorAll('.saved').forEach(e=>e.textContent=t)}
async function save(){
  let sc=null;
  try{sc=stamp();await idb.set('db',db);setSaved('저장됨 '+new Date().toLocaleTimeString('ko-KR'))}
  catch(e){setSaved('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}
  syncPush(sc);
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}

/* 지도: 카카오 키가 있으면 카카오맵, 없으면 OpenFreeMap(Leaflet) */
const KAKAO_KEY=(window.APP_CONFIG&&window.APP_CONFIG.kakaoKey)||'';
let MAP=null;
const pinHTML=(icon,trip)=>'<div class="pin'+(trip?' trip':'')+'"><span>'+icon+'</span></div>';
function distM(la1,lo1,la2,lo2){
  const R=6371000,r=Math.PI/180,dl=(la2-la1)*r,dg=(lo2-lo1)*r;
  const a=Math.sin(dl/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const START=[37.2703,127.1500];
const osmCat=v=>/^(hotel|guest_house|hostel|motel|apartment|resort)$/.test(v||'')?'lodging':/bakery|pastry|confectionery/.test(v||'')?'bakery':v==='cafe'?'cafe':/^(restaurant|fast_food|food_court|pub|bar)$/.test(v||'')?'food':'';

function makeLeafletMap(){
  const map=L.map('map',{zoomControl:false}).setView(START,16);
  L.control.zoom({position:'bottomright'}).addTo(map);
  try{
    L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',
      attribution:'&copy; OpenFreeMap &copy; OpenMapTiles &copy; OpenStreetMap'}).addTo(map);
  }catch(e){
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  }
  let pins=[],line=null;
  const addrOf=pr=>[[pr.street,pr.housenumber].filter(Boolean).join(' '),pr.district,pr.city||pr.county].filter(Boolean).join(' · ');
  return {
    setView:(lat,lng,z)=>map.setView([lat,lng],z||16),
    pan:(lat,lng)=>map.panTo([lat,lng]),
    fit(pts){if(!pts.length)return;if(pts.length===1)return map.setView(pts[0],16);map.fitBounds(L.latLngBounds(pts),{padding:[70,70],maxZoom:16})},
    cursor:on=>{map.getContainer().style.cursor=on?'crosshair':''},
    onClick:fn=>map.on('click',e=>fn(e.latlng.lat,e.latlng.lng)),
    drawPins(items,open,trip){
      pins.forEach(m=>m.remove());
      pins=items.map(p=>{
        const icon=L.divIcon({className:'',html:pinHTML(p.icon,trip),iconSize:[34,34],iconAnchor:[17,34]});
        const m=L.marker([p.lat,p.lng],{icon}).addTo(map);
        m.bindTooltip(p.label||'이름 없는 곳',{direction:'top',offset:[0,-34]});
        m.on('click',()=>open(p.id));return m;
      });
    },
    drawRoute(pts){if(line){line.remove();line=null}if(pts.length>1)line=L.polyline(pts,{color:'#2f6f73',weight:4,opacity:.85,dashArray:'6 8'}).addTo(map)},
    async search(q){
      const c=map.getCenter();
      const get=async s=>{
        const r=await fetch('https://photon.komoot.io/api/?limit=10&lat='+c.lat+'&lon='+c.lng+'&q='+encodeURIComponent(s));
        const j=await r.json();return (j.features||[]).filter(f=>(f.properties.countrycode||'KR')==='KR');
      };
      let feats=await get(q);
      if(!feats.length&&q.includes(' '))feats=await get(q.split(/\s+/)[0]);
      return feats.map(f=>{const pr=f.properties;
        return {name:pr.name||'',addr:addrOf(pr),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],cat:osmCat(pr.osm_value)}});
    }
  };
}

function makeKakaoMap(){
  const K=kakao.maps;
  const map=new K.Map($('map'),{center:new K.LatLng(START[0],START[1]),level:3});
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  const places=new K.services.Places();
  let pins=[],line=null;
  return {
    setView:(lat,lng)=>{map.setLevel(3);map.setCenter(new K.LatLng(lat,lng))},
    pan:(lat,lng)=>map.panTo(new K.LatLng(lat,lng)),
    fit(pts){if(!pts.length)return;if(pts.length===1){map.setLevel(3);return map.setCenter(new K.LatLng(pts[0][0],pts[0][1]))}
      const b=new K.LatLngBounds();pts.forEach(p=>b.extend(new K.LatLng(p[0],p[1])));map.setBounds(b,90,60,90,60)},
    cursor:on=>map.setCursor(on?'crosshair':''),
    onClick:fn=>K.event.addListener(map,'click',e=>fn(e.latLng.getLat(),e.latLng.getLng())),
    drawPins(items,open,trip){
      pins.forEach(o=>o.setMap(null));
      pins=items.map(p=>{
        const el=document.createElement('div');el.className='kpin';
        el.innerHTML=pinHTML(p.icon,trip)+'<div class="plabel"></div>';
        el.querySelector('.plabel').textContent=p.label||'';
        el.onclick=ev=>{ev.stopPropagation();open(p.id)};
        const o=new K.CustomOverlay({position:new K.LatLng(p.lat,p.lng),content:el,yAnchor:1,clickable:true});
        o.setMap(map);return o;
      });
    },
    drawRoute(pts){
      if(line){line.setMap(null);line=null}
      if(pts.length>1){line=new K.Polyline({path:pts.map(p=>new K.LatLng(p[0],p[1])),strokeWeight:4,strokeColor:'#2f6f73',strokeOpacity:.85,strokeStyle:'shortdash'});line.setMap(map)}
    },
    search(q){
      const c=map.getCenter();
      return new Promise((ok,no)=>{
        places.keywordSearch(q,(data,status)=>{
          if(status===K.services.Status.OK)ok(data.map(d=>{
            const g=d.category_group_code,bak=/베이커리|제과|빵/.test(d.category_name||'');
            const cat=g==='CE7'?'cafe':bak?'bakery':g==='FD6'?'food':g==='AD5'?'lodging':g==='AT4'?'spot':'';
            return {name:d.place_name,addr:d.road_address_name||d.address_name,lat:+d.y,lng:+d.x,cat};
          }));
          else if(status===K.services.Status.ZERO_RESULT)ok([]);
          else no(new Error(status));
        },{location:c});
      });
    }
  };
}

function loadKakao(){
  return new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KAKAO_KEY)+'&libraries=services&autoload=false';
    s.onload=()=>kakao.maps.load(ok);s.onerror=()=>no(new Error('kakao'));
    document.head.appendChild(s);
  });
}
async function initMap(){
  if(KAKAO_KEY){
    try{await loadKakao();MAP=makeKakaoMap()}catch(e){console.warn('카카오 지도를 불러오지 못해 기본 지도를 사용합니다',e)}
  }
  if(!MAP)MAP=makeLeafletMap();
  MAP.onClick(onMapClick);
}

/* 여행 정렬: 날짜, 시간 순 */
function sortedStops(t){
  return t.stops.map((s,i)=>[s,i]).sort((a,b)=>(a[0].date||'9999').localeCompare(b[0].date||'9999')||(a[0].time||'').localeCompare(b[0].time||'')||a[1]-b[1]).map(x=>x[0]);
}
function tripTotal(t){return t.stops.reduce((s,x)=>s+(+x.cost||0),0)}
function drawMarkers(){
  if(!MAP)return;
  if(section==='trip'){
    const st=activeTrip?sortedStops(activeTrip).filter(s=>s.lat):[];
    MAP.drawPins(st.map((s,i)=>({id:s.id,lat:s.lat,lng:s.lng,icon:KIND[s.kind].icon,label:(i+1)+'. '+(s.name||'이름 없는 곳')})),openStop,true);
    MAP.drawRoute(st.map(s=>[s.lat,s.lng]));
  }else{
    MAP.drawRoute([]);
    MAP.drawPins(db.places.map(p=>({id:p.id,lat:p.lat,lng:p.lng,icon:p.kind==='bakery'?'🥐':'☕',label:p.name})),openEdit,false);
  }
}
function fitTrip(){
  const st=activeTrip?activeTrip.stops.filter(s=>s.lat):[];
  if(st.length)MAP.fit(st.map(s=>[s.lat,s.lng]));
}

/* 홈 화면 */
function showPhoto(){
  const has=!!db.home.photo,hs=$('homeScreen'),img=$('homeImg');
  img.hidden=!has;$('homeEmpty').hidden=has;
  if(!has){hs.style.background='';hs.classList.remove('light');return}
  // 사진 맨 위쪽 색을 화면 배경색으로 써서 사진과 자연스럽게 이어지게 함
  img.onload=()=>{
    try{
      const c=document.createElement('canvas');c.width=48;c.height=72;
      const x=c.getContext('2d');x.drawImage(img,0,0,48,72);
      const d=x.getImageData(0,0,48,3).data;let r=0,g=0,b=0,n=d.length/4;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
      r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);
      hs.style.background='rgb('+r+','+g+','+b+')';
      hs.classList.toggle('light',(0.299*r+0.587*g+0.114*b)>150);
    }catch(e){hs.style.background='';hs.classList.remove('light')}
  };
  img.src=db.home.photo;
}
function drawHome(){
  const d=new Date();
  $('homeDate').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일';
  $('appVer').textContent='앱 버전 '+APP_VER;
  const cafeSum=db.places.reduce((s,p)=>s+total(p),0);
  $('homeCafeSub').textContent=db.places.length?db.places.length+'곳 방문 · '+won(cafeSum):'아직 기록이 없어요';
  const stops=db.trips.reduce((s,t)=>s+t.stops.length,0);
  $('homeTripSub').textContent=db.trips.length?db.trips.length+'개의 여행 · 장소 '+stops+'곳':'아직 여행 기록이 없어요';
  showPhoto();
}
function showHome(){
  cancelMode();section=null;activeTrip=null;
  ['listScreen','editScreen','tripScreen','stopScreen'].forEach(i=>$(i).hidden=true);
  document.body.classList.remove('trip');
  drawHome();$('homeScreen').hidden=false;
}
function enterSection(s){
  section=s;activeTrip=null;
  document.body.classList.toggle('trip',s==='trip');
  $('homeScreen').hidden=true;
  $('tabListLabel').textContent=s==='trip'?'일정':'목록';
  $('q').placeholder=s==='trip'?'장소 검색 (명소·식당·카페·숙소)':'가게 이름 검색 (예: 스타벅스 동백)';
  drawMarkers();
  setTab(s==='trip'?'list':'map');
}
$('goCafe').onclick=()=>enterSection('cafe');
$('goTrip').onclick=()=>enterSection('trip');
$('tabHome').onclick=showHome;
$('homeCam').onclick=()=>$('homeFile').click();
$('homeEmptyBtn').onclick=()=>$('homeFile').click();
$('homeFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  db.home.photo=await shrink(f,1600,.82);e.target.value='';showPhoto();save();
};

/* 화면 전환 */
let mode=null; // {type:'add',name} | {type:'move',target,reopen}
function setTab(t){
  ['Map','List'].forEach(n=>$('tab'+n).classList.toggle('on',t===n.toLowerCase()));
  $('listScreen').hidden=t!=='list';
  if(t==='list')drawList();
  else if(section==='trip'&&activeTrip)fitTrip();
}
$('tabMap').onclick=()=>{cancelMode();setTab('map')};
$('tabList').onclick=()=>{cancelMode();setTab('list')};
$('tabAdd').onclick=()=>{
  if(section==='trip'&&!activeTrip){setTab('list');return}

};

let searchTimer,searchSeq=0;
function hideResults(){$('results').hidden=true}
function tagOf(it){return it.cat?KIND[it.cat].label:''}
async function runSearch(q){
  const my=++searchSeq,box=$('results');
  if(section==='trip'&&!activeTrip){
    box.innerHTML='<div class="none">먼저 여행을 선택하거나 새로 만들어 주세요.</div>';
    const b=document.createElement('button');b.type='button';b.className='manual';b.textContent='여행 목록 열기';
    b.onclick=()=>{hideResults();$('q').value='';setTab('list')};box.appendChild(b);box.hidden=false;return;
  }
  let items;
  try{items=await MAP.search(q)}catch(e){
    if(my!==searchSeq)return;
    box.innerHTML='<div class="none">검색에 연결하지 못했어요. 인터넷을 확인해 주세요.</div>';box.hidden=false;return;
  }
  if(my!==searchSeq)return;
  box.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');b.type='button';
    b.innerHTML='<div class="rn"></div><div class="rs"></div>';
    b.querySelector('.rn').textContent=it.name||it.addr;
    if(tagOf(it)){const s=document.createElement('span');s.className='tag';s.textContent=tagOf(it);b.querySelector('.rn').appendChild(s)}
    b.querySelector('.rs').textContent=it.addr;
    b.onclick=()=>pickResult(it);
    box.appendChild(b);
  });
  if(!items.length){const d=document.createElement('div');d.className='none';d.textContent='검색 결과가 없어요.';box.appendChild(d)}
  const m=document.createElement('button');m.type='button';m.className='manual';
  m.textContent='"'+q+'" 이름으로 지도에서 직접 찍기';
  m.onclick=()=>{hideResults();$('q').value='';startMode({type:'add',name:q},'지도에서 방문한 곳을 눌러 주세요')};
  box.appendChild(m);
  box.hidden=false;
}
function pickResult(it){
  hideResults();$('q').value='';$('q').blur();
  MAP.setView(it.lat,it.lng,17);
  if(section==='trip'){addStop({name:it.name,lat:it.lat,lng:it.lng,kind:it.cat||'spot'});return}
  let p=db.places.find(x=>x.name===it.name&&distM(x.lat,x.lng,it.lat,it.lng)<100);
  if(!p){p=newPlace(it.lat,it.lng);p.name=it.name;p.kind=it.cat==='bakery'?'bakery':'cafe';db.places.push(p);save();drawMarkers()}
  openEdit(p.id,!it.name);
}
$('q').oninput=()=>{
  clearTimeout(searchTimer);const q=$('q').value.trim();
  if(q.length<2){searchSeq++;hideResults();return}
  searchTimer=setTimeout(()=>runSearch(q),350);
};

  const t=activeTrip;

    +'<div class="actions"><button class="btn on" id="tdAdd" type="button">+ 장소 추가</button><button class="btn" id="tdMap" type="button">지도로 보기</button></div>'
    +'<div class="hint" style="color:var(--muted);font-size:12px">지도 위 검색창으로 찾거나, 지도를 눌러서 추가해요.</div>';

  let last=null,n=0;
  st.forEach(s=>{

function stars(el,get,set,scoreEl){
  el.innerHTML='';
  for(let i=1;i<=5;i++){
    const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('aria-label',i+'점');
    b.onclick=()=>{set(get()===i?0:i);draw();queueSave()};el.appendChild(b);
  }
  function draw(){[...el.children].forEach((b,i)=>b.classList.toggle('on',i<get()));scoreEl.textContent=get()?get()+' / 5':'평가 전'}
  draw();
}
function shrink(file,max=1000,q=.78){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function mountPhotos(box,fileEl,getArr){
  function draw(){
    box.innerHTML='';
    getArr().forEach((src,i)=>{
      const d=document.createElement('div');d.className='ph';
      d.innerHTML='<img alt="방문 사진 '+(i+1)+'"><button type="button" aria-label="사진 삭제">×</button>';
      d.querySelector('img').src=src;
      d.querySelector('button').onclick=()=>{getArr().splice(i,1);draw();save()};
      box.appendChild(d);
    });
    const a=document.createElement('div');a.className='addph';a.tabIndex=0;a.textContent='+ 사진 추가';
    a.onclick=()=>fileEl.click();
    a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileEl.click()}};
    box.appendChild(a);
  }
  fileEl.onchange=async e=>{for(const f of e.target.files)getArr().push(await shrink(f));e.target.value='';draw();save()};
  draw();
}
function armDelete(btn,fn){

    if(!armed){armed=true;btn.textContent='정말 삭제';clearTimeout(timer);timer=setTimeout(()=>{armed=false;btn.textContent='삭제'},3000);return}
    fn();
  };
}

const SB_URL=(window.APP_CONFIG&&window.APP_CONFIG.supabaseUrl)||'', SB_KEY=(window.APP_CONFIG&&window.APP_CONFIG.supabaseKey)||'';
let sb=null,sbUser=null,syncOn=false,pushing=false,pendingPush=false,channel=null;

const seen={}; // 마지막으로 확인한 지문 (수정 시각을 찍기 위함)
function canon(v){
  if(Array.isArray(v))return v.map(canon);
  if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{if(k!=='_u')o[k]=canon(v[k])});return o}
  return v;
}
const hashOf=o=>JSON.stringify(canon(o));
function localItems(){
  return [{id:'home',kind:'home',obj:db.home}].concat(db.places.map(o=>({id:o.id,kind:'place',obj:o})),db.trips.map(o=>({id:o.id,kind:'trip',obj:o})));
}
function stamp(){
  const now=new Date().toISOString();
  const sc=localItems().map(it=>Object.assign({},it,{h:hashOf(it.obj)}));
  sc.forEach(it=>{if(seen[it.id]!==it.h){it.obj._u=now;seen[it.id]=it.h}});
  return sc;
}
function setSync(t){$('syncState').textContent=t}
function isEditing(id){
  if(!$('editScreen').hidden&&cur&&cur.id===id)return true;
  if(!$('tripScreen').hidden&&curTrip&&curTrip.id===id)return true;
  if(!$('stopScreen').hidden&&activeTrip&&activeTrip.id===id)return true;
  return false;
}
function findLocal(id,kind){return kind==='home'?db.home:(kind==='place'?db.places:db.trips).find(x=>x.id===id)}
function replaceLocal(r){
  const o=Object.assign({},r.data);o._u=r.updated_at;
  if(r.kind==='home'){db.home=Object.assign({photo:''},o);return db.home}
  const arr=r.kind==='place'?db.places:db.trips,n=(r.kind==='place'?norm:normTrip)(o),i=arr.findIndex(x=>x.id===r.id);
  if(i>=0)arr[i]=n;else arr.push(n);
  return n;
}
function adopt(r){const o=replaceLocal(r),h=hashOf(o);seen[r.id]=h;synced[r.id]={h,k:r.kind};return true}
// 서버의 기록 하나를 내 폰에 합치기. 바뀌었으면 true
function mergeRow(r){
  if(isEditing(r.id))return false;
  const loc=findLocal(r.id,r.kind);
  if(r.deleted){
    if(loc&&r.kind!=='home'){const arr=r.kind==='place'?db.places:db.trips;arr.splice(arr.indexOf(loc),1);delete synced[r.id];delete seen[r.id];return true}
    return false;
  }
  if(!loc){return synced[r.id]?false:adopt(r)} // 내가 지운 것이면 삭제 표시를 올리고, 아니면 새 기록으로 받음
  if(hashOf(loc)===hashOf(r.data||{})){const h=hashOf(loc);synced[r.id]={h,k:r.kind};return false}
  const lu=Date.parse(loc._u||0)||0,ru=Date.parse(r.updated_at)||0;
  return ru>lu?adopt(r):false;
}
function refreshUI(){
  if(activeTrip)activeTrip=db.trips.find(t=>t.id===activeTrip.id)||null;
  drawMarkers();
  if(!$('listScreen').hidden)drawList();
  if(!$('homeScreen').hidden)drawHome();
}
async function syncPull(){
  const {data,error}=await sb.from('items').select('*');
  if(error)throw error;
  let changed=false;const ids=new Set();
  data.forEach(r=>{ids.add(r.id);if(mergeRow(r))changed=true});
  Object.keys(synced).forEach(id=>{if(!ids.has(id))delete synced[id]}); // 서버에 없으면 다시 올림
  if(changed){await idb.set('db',db);refreshUI()}
  await idb.set('synced',synced);
}
async function syncPush(sc0){
  if(!sb||!sbUser||!syncOn)return;
  if(pushing){pendingPush=true;return}
  pushing=true;
  try{
    let first=true;
    do{
      pendingPush=false;
      const sc=(first&&sc0)||stamp();first=false;
      const now=new Date().toISOString(),present=new Set(),rows=[];
      sc.forEach(it=>{
        present.add(it.id);const s=synced[it.id];
        if(s&&s.h===it.h)return;
        if(it.kind==='home'&&!it.obj.photo&&!s)return;
        rows.push({id:it.id,kind:it.kind,data:it.obj,updated_at:it.obj._u||now,deleted:false,_h:it.h});
      });
      Object.keys(synced).forEach(id=>{if(!present.has(id))rows.push({id,kind:synced[id].k,data:{},updated_at:now,deleted:true,_h:null})});
      for(let i=0;i<rows.length;i+=4){
        const chunk=rows.slice(i,i+4);
        const {error}=await sb.from('items').upsert(chunk.map(({_h,...r})=>r));
        if(error)throw error;
        chunk.forEach(r=>{if(r.deleted)delete synced[r.id];else synced[r.id]={h:r._h,k:r.kind}});
      }
      if(rows.length)await idb.set('synced',synced);
    }while(pendingPush);
    setSync('가족과 동기화됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSync('오프라인 · 연결되면 자동으로 올라가요');console.warn('동기화 실패',e)}
  pushing=false;
}
function startRealtime(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('items-sync').on('postgres_changes',{event:'*',schema:'public',table:'items'},p=>{
    const r=p.new;
    if(!r||!r.id||!r.data){syncPull().catch(()=>{});return}
    if(mergeRow(r)){idb.set('db',db);idb.set('synced',synced);refreshUI()}
  }).subscribe();
}
async function startSync(){
  syncOn=true;setSync('동기화 중…');
  try{await syncPull();await syncPush();startRealtime()}
  catch(e){setSync('오프라인 · 연결되면 자동으로 올라가요');console.warn('동기화 시작 실패',e)}
}
function showLogin(){$('loginScreen').hidden=false;$('logoutBtn').hidden=true}
$('loginForm').onsubmit=async e=>{
  e.preventDefault();$('lErr').textContent='';$('lBtn').disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPw').value});
    if(error){$('lErr').textContent=/network|fetch/i.test(error.message)?'인터넷에 연결되어 있는지 확인해 주세요.':'이메일이나 비밀번호가 맞지 않아요.';return}
    sbUser=data.user;$('lPw').value='';$('loginScreen').hidden=true;$('logoutBtn').hidden=false;startSync();
  }catch(err){$('lErr').textContent='로그인하지 못했어요. 인터넷 연결을 확인해 주세요.'}
  finally{$('lBtn').disabled=false}
};
$('logoutBtn').onclick=async()=>{
  syncOn=false;if(channel){sb.removeChannel(channel);channel=null}
  try{await sb.auth.signOut()}catch(e){}
  sbUser=null;setSync('');showLogin();
};
async function initAuth(){
  if(!SB_URL||!SB_KEY){setSync('공유 꺼짐: 설정 파일을 읽지 못했어요');return}
  if(!window.supabase){setSync('공유 꺼짐: 로그인 도구를 불러오지 못했어요');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY);
  let s=null;try{const r=await sb.auth.getSession();s=r.data.session}catch(e){}
  if(s){sbUser=s.user;$('logoutBtn').hidden=false;startSync()}
  else if(navigator.onLine)showLogin();
  else setSync('오프라인 · 이 폰에만 저장 중');
  window.addEventListener('online',()=>{if(sbUser)startSync();else showLogin()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sbUser&&syncOn)syncPull().then(()=>syncPush()).catch(()=>{})});
}

/* 시작 */

  let d; try{d=await idb.get('db')}catch(e){}
  if(!d){ // 이전 버전에서 입력한 내용이 있으면 가져옴
    try{const old=JSON.parse(localStorage.getItem('cafe-map-v1'));if(old&&old.places)d=old}catch(e){}
  }

  db=d;
  try{synced=(await idb.get('synced'))||{}}catch(e){}
  localItems().forEach(it=>seen[it.id]=hashOf(it.obj));
  await initMap();
  if(db.places[0])MAP.setView(db.places[0].lat,db.places[0].lng,16);

})();
